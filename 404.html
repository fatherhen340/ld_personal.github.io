<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面走丢了 · 林知远</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3efe6;
      color: #19251d;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(560px, 100%);
      padding: 42px;
      border: 1px solid rgba(25, 37, 29, .18);
      background: #faf7f0;
    }
    .index { margin-bottom: 28px; color: #a74b2e; font-family: Consolas, monospace; font-size: 10px; letter-spacing: .14em; }
    h1 { margin: 0 0 18px; font-family: "Songti SC", "STSong", serif; font-size: clamp(38px, 7vw, 58px); font-weight: 500; line-height: 1.2; letter-spacing: -.04em; }
    p { margin: 0 0 28px; color: #6f786e; font-size: 13px; line-height: 1.9; }
    a { display: inline-flex; min-height: 42px; align-items: center; padding: 0 18px; background: #1d3a2a; color: #f8f3e8; font-size: 12px; text-decoration: none; }
    a:hover { background: #a74b2e; }
  </style>
  <script>
    window.setTimeout(function () {
      window.location.replace("./");
    }, 1800);
  </script>
</head>
<body>
  <main class="card">
    <p class="index">404 / NOT FOUND</p>
    <h1>这一页，<br>暂时还没有写。</h1>
    <p>你访问的地址不存在，或者内容已经被移动。即将返回首页；如果没有自动跳转，可以点击下面的按钮。</p>
    <a href="./">回到首页</a>
  </main>
</body>
</html>
